site_name: "SystemSpec: API Style"
site_description: Machine-readable API style specification format
site_url: https://plexusone.dev/systemspec-apistyle
repo_url: https://github.com/plexusone/systemspec-apistyle
repo_name: plexusone/systemspec-apistyle

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # Dark mode first (PlexusOne default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - https://plexusone.dev/css/plexusone-mkdocs.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guide:
      - Getting Started: guide/getting-started.md
      - Automated API Governance: guide/automated-api-governance.md
      - CI/CD Integration: guide/ci-cd.md
      - Using Profiles: guide/profiles.md
      - Profile Comparison: guide/profile-comparison.md
      - Profile Scoring: guide/profile-scoring.md
      - Documentation Generation: guide/documentation-generation.md
      - Custom Rules: guide/custom-rules.md
      - MCP Server: guide/mcp-server.md
  - Reference:
      - CLI Commands: reference/cli.md
      - Configuration File: reference/config.md
      - Specification Format: reference/schema.md
      - AI Assistant Hooks: reference/hooks.md
  - Profiles:
      - Default: profiles/default.md
      - Comprehensive: profiles/comprehensive.md
      - Minimal: profiles/minimal.md
      - Azure: profiles/azure.md
      - Google: profiles/google.md
      - Microsoft REST: profiles/microsoft-rest.md
      - Microsoft Graph: profiles/microsoft-graph.md
      - Zalando: profiles/zalando.md
  - Design:
      - Constitution: specs/CONSTITUTION.md
      - MRD: specs/inception/MRD.md
      - PRD: specs/inception/PRD.md
      - TRD: specs/inception/TRD.md
      - Roadmap: specs/inception/ROADMAP.md
  - Releases:
      - Changelog: releases/changelog.md
      - v0.6.0: releases/v0.6.0.md
      - v0.5.0: releases/v0.5.0.md
      - v0.4.0: releases/v0.4.0.md
      - v0.3.0: releases/v0.3.0.md
      - v0.2.0: releases/v0.2.0.md
      - v0.1.0: releases/v0.1.0.md

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/plexusone/systemspec-apistyle
